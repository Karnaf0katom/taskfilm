name: Deploy verified release preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag with an attached checked preview bundle
        required: true
        default: v0.1.0a1
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download the named release preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+|b[0-9]+|rc[0-9]+)?', os.environ['TAG']):
              raise SystemExit('use a TASKFILM version tag')
          PY
          gh release download "$TAG" --pattern "taskfilm-preview-${TAG}.zip" --pattern DEMO-SHA256SUMS --dir package
          python release/unpack_preview.py "package/taskfilm-preview-${TAG}.zip" --checksums package/DEMO-SHA256SUMS --out website
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked static files
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
