name: Taskfilm CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel
        run: python -m pip install "$(find dist -name '*.whl')[browser,motion,dev]"
      - name: Test the installed wheel outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I -m taskfilm doctor --json
          python -m pytest -q "$GITHUB_WORKSPACE/tests"
      - name: Install and test the source distribution
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install "$(find dist -name '*.tar.gz')[browser,motion,dev]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" -I -m taskfilm doctor --json
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pytest -q "$GITHUB_WORKSPACE/tests"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install "$(find dist -name '*.whl')[browser,motion,dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Capture and test outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          TASKFILM_BROWSER_TEST=1 python -m pytest -q "$GITHUB_WORKSPACE/tests"
      - name: Check audio through a complete HyperFrames render
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/chrome"
          export HYPERFRAMES_BROWSER_PATH="$(find "$RUNNER_TEMP/chrome" -type f -name chrome-headless-shell -print -quit)"
          export HYPERFRAMES_SKIP_SKILLS=1 HYPERFRAMES_TELEMETRY_DISABLED=1
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/render_audio_smoke.py" --out "$RUNNER_TEMP/render-audio" --hyperframes 0.8.134
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-render-audio-proof
          path: |
            ${{ runner.temp }}/render-audio/verification.json
            ${{ runner.temp }}/render-audio/check.log
            ${{ runner.temp }}/render-audio/render.log
            ${{ runner.temp }}/render-audio/out.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
